name: CD Release - AI Auto-Version & Client Delivery (releases)

# Kịch bản này tự động chạy khi merge code vào nhánh releases
on:
    push:
        branches: [releases]

jobs:
    # ----------------------------------------------------------------------------
    # JOB 1: KIỂM ĐỊNH CHẤT LƯỢNG & GEMINI AI TỰ ĐỘNG TĂNG VERSION + CHANGELOG
    # ----------------------------------------------------------------------------
    prepare-and-version-release:
        name: Quality Check & AI Version Bump
        runs-on: ubuntu-latest
        permissions:
            contents: write # Cần quyền để commit code và push tag lên repo
        outputs:
            new_version: ${{ steps.ai_bump.outputs.new_version }}
            changelog: ${{ steps.ai_bump.outputs.changelog }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Inject Environment Variables from Secrets
              run: |
                  touch .env
                  if [ -n "${{ secrets.EXPO_PUBLIC_API_BASE_URL }}" ]; then
                    echo "EXPO_PUBLIC_API_BASE_URL=${{ secrets.EXPO_PUBLIC_API_BASE_URL }}" >> .env
                    echo "EXPO_PUBLIC_API_BASE_URL=${{ secrets.EXPO_PUBLIC_API_BASE_URL }}" >> $GITHUB_ENV
                  fi
                  if [ -n "${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}" ]; then
                    echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}" >> .env
                    echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}" >> $GITHUB_ENV
                  fi

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Verify Code Quality (Lint & Typecheck)
              run: |
                  npm run lint
                  npx tsc --noEmit

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.x"

            # Chạy script AI tự động tăng version dựa theo Conventional Commits
            - name: Run AI Version Bump Script
              id: ai_bump
              env:
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
              run: python3 .github/scripts/ai-release-bump.py

            # Tự động commit file app.json đã cập nhật version và tạo Git Tag vX.Y.Z
            - name: Commit Updated Version & Push Tag
              run: |
                  NEW_VER="${{ steps.ai_bump.outputs.new_version }}"
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add app.json package.json
                  git commit -m "chore(release): bump version to v${NEW_VER} [skip ci]" || echo "No changes to commit"
                  git tag "v${NEW_VER}"
                  git push origin releases --tags

    # ----------------------------------------------------------------------------
    # JOB 2: BUILD PRODUCTION APK SIÊU NHẸ TRÊN EXPO EAS CLOUD
    # ----------------------------------------------------------------------------
    build-production-eas:
        name: Build Production on EAS Cloud
        needs: prepare-and-version-release
        runs-on: ubuntu-latest
        outputs:
            download_url: ${{ steps.eas_build.outputs.download_url }}
        steps:
            # Lấy code mới nhất đã có version vừa được cập nhật ở Job 1
            - name: Checkout Releases
              uses: actions/checkout@v4
              with:
                  ref: releases

            - name: Inject Environment Variables from Secrets
              run: |
                  touch .env
                  if [ -n "${{ secrets.EXPO_PUBLIC_API_BASE_URL }}" ]; then
                    echo "EXPO_PUBLIC_API_BASE_URL=${{ secrets.EXPO_PUBLIC_API_BASE_URL }}" >> .env
                    echo "EXPO_PUBLIC_API_BASE_URL=${{ secrets.EXPO_PUBLIC_API_BASE_URL }}" >> $GITHUB_ENV
                  fi
                  if [ -n "${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}" ]; then
                    echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}" >> .env
                    echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}" >> $GITHUB_ENV
                  fi

            - name: Set up EAS CLI
              uses: expo/expo-github-action@v8
              with:
                  eas-version: latest
                  token: ${{ secrets.EXPO_TOKEN }}

            # Build profile production trên EAS Cloud (áp dụng plugin withAndroidOptimizations)
            - name: Build Production APK via EAS
              id: eas_build
              env:
                  EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
                  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
              run: |
                  eas build --platform android --profile production --non-interactive --json > build_output.json
                  DOWNLOAD_URL=$(jq -r '.[0].artifacts.buildUrl' build_output.json)
                  echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT

    # ----------------------------------------------------------------------------
    # JOB 3: TẠO GITHUB RELEASE CHÍNH THỨC & GỬI EMAIL BÀN GIAO CHO KHÁCH HÀNG
    # ----------------------------------------------------------------------------
    deliver-to-client:
        name: Create GitHub Release & Email Clients
        needs: [prepare-and-version-release, build-production-eas]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            # 1. Tạo bản Release chính thức trên GitHub Releases
            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: "v${{ needs.prepare-and-version-release.outputs.new_version }}"
                  name: "Phiên bản Release v${{ needs.prepare-and-version-release.outputs.new_version }}"
                  body: |
                      ### 🐾 9Paws Mobile App — Bản Phát Hành Chính Thức
                      **Ghi chú phát hành (Release Notes):**
                      ${{ needs.prepare-and-version-release.outputs.changelog }}

                      - 📲 **Đường dẫn tải APK trực tiếp:** [Tải tại đây](<${{ needs.build-production-eas.outputs.download_url }}>)
                  draft: false
                  prerelease: false

            # 2. Điền thông tin vào mẫu Email an toàn tuyệt đối (Render Markdown thành Rich HTML)
            - name: Prepare Release Email Content
              env:
                  NEW_VERSION: ${{ needs.prepare-and-version-release.outputs.new_version }}
                  CHANGELOG: ${{ needs.prepare-and-version-release.outputs.changelog }}
                  DOWNLOAD_URL: ${{ needs.build-production-eas.outputs.download_url }}
              run: |
                  python3 -m pip install markdown
                  python3 .github/scripts/prepare-release-email.py

            # 3. Gửi email bàn giao trang trọng cho Khách hàng
            - name: Send Email to Clients
              uses: dawidd6/action-send-mail@v3
              with:
                  server_address: smtp.gmail.com
                  server_port: 465
                  secure: true
                  username: ${{ secrets.MAIL_USERNAME }}
                  password: ${{ secrets.MAIL_PASSWORD }}
                  subject: "🎉 [9Paws] Bàn giao phiên bản ứng dụng chính thức v${{ needs.prepare-and-version-release.outputs.new_version }}"
                  to: ${{ secrets.CLIENT_EMAILS }}
                  from: "9Paws Team <${{ secrets.MAIL_USERNAME }}>"
                  html_body: file://release-email-ready.html
