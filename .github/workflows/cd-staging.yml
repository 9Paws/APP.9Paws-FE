name: CD Staging - Build Lightweight APK & Notify Testers (main)

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    staging-pipeline:
        name: Build Fast Staging APK & Notify Testers
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: read
            actions: read
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Kéo toàn bộ lịch sử commit để đọc thông tin PR

            - name: Inject Environment Variables from Secrets
              run: |
                  touch .env
                  if [ -n "${{ secrets.EXPO_PUBLIC_API_BASE_URL }}" ]; then
                    echo "EXPO_PUBLIC_API_BASE_URL=${{ secrets.EXPO_PUBLIC_API_BASE_URL }}" >> .env
                    echo "EXPO_PUBLIC_API_BASE_URL=${{ secrets.EXPO_PUBLIC_API_BASE_URL }}" >> $GITHUB_ENV
                  fi
                  if [ -n "${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}" ]; then
                    echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}" >> .env
                    echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}" >> $GITHUB_ENV
                  fi
                  echo "Successfully injected environment variables from repository secrets into .env"

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Verify Code Quality (Lint & Typecheck)
              run: |
                  npm run lint
                  npx tsc --noEmit

            - name: Set up Java JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "17"

            - name: Generate Android Native Project (Fast Prebuild)
              env:
                  EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
                  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
              run: npx expo prebuild --platform android --clean --no-install

            - name: Setup Gradle Build Cache
              uses: gradle/actions/setup-gradle@v4

            - name: Restore Keystore from Secrets
              run: |
                  echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

            - name: Configure Gradle Signing & Extreme Speed Tuning
              env:
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
              run: python3 .github/scripts/configure-staging-gradle.py

            - name: Build APK via Parallel Gradle
              env:
                  EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
                  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
              run: |
                  cd android
                  chmod +x gradlew
                  ./gradlew assembleRelease --build-cache --parallel -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

            - name: Check APK Size
              run: |
                  APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
                  cp $APK_FILE ./9Paws-Staging.apk
                  ls -lh 9Paws-Staging.apk

            - name: Upload APK Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: 9Paws-Staging-APK
                  path: ./9Paws-Staging.apk
                  retention-days: 14

            # ------------------------------------------------------------------------
            # PHÁT HÀNH BẢN GITHUB RELEASE KÈM TỆP APK DOWNLOAD THEO VERSION
            # ------------------------------------------------------------------------
            - name: Publish Versioned GitHub Release & APK Download
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  APP_VERSION=$(node -p "require('./package.json').version")
                  TAG_NAME="v${APP_VERSION}"
                  RELEASE_TITLE="v${APP_VERSION}"
                  APK_NAME="9Paws-${TAG_NAME}.apk"

                  cp ./9Paws-Staging.apk ./"$APK_NAME"

                  echo "Publishing release: $RELEASE_TITLE (Tag: $TAG_NAME)..."

                  echo "### 🐾 9Paws Mobile App — $RELEASE_TITLE" > release_notes.md
                  echo "" >> release_notes.md
                  echo "**Điểm nổi bật trong bản phát hành:**" >> release_notes.md
                  echo "- 🎨 Sửa triệt để viền trắng vuông góc quanh avatar/mascot Miu Miu trên toàn bộ ứng dụng." >> release_notes.md
                  echo "- ⚡ Cải tiến luồng khởi động: loại bỏ màn hình splash tĩnh, chuyển tiếp mượt mà vào splash động." >> release_notes.md
                  echo "- 📦 Tối ưu hóa dung lượng file APK giảm hơn 50% (từ 57MB xuống ~24.9MB) nhờ nén Hermes bytecode và useLegacyPackaging." >> release_notes.md

                  if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
                    gh release create "$TAG_NAME" ./"$APK_NAME" \
                      --target "${{ github.sha }}" \
                      --title "$RELEASE_TITLE" \
                      --notes-file release_notes.md \
                      --prerelease
                  else
                    echo "Release $TAG_NAME đã tồn tại, cập nhật tệp APK..."
                    gh release upload "$TAG_NAME" ./"$APK_NAME" --clobber
                  fi

                  if ! gh release view "v1.0.0" >/dev/null 2>&1; then
                    echo "Kiểm tra và tạo release cho v1.0.0 từ artifact lưu trữ..."
                    if gh api "repos/${{ github.repository }}/actions/artifacts/13446218303/zip" > v100_artifact.zip 2>/dev/null; then
                      mkdir -p v100_extracted
                      unzip -o v100_artifact.zip -d v100_extracted
                      V100_APK=$(find v100_extracted -name "*.apk" | head -n 1)
                      if [ -n "$V100_APK" ]; then
                        cp "$V100_APK" ./9Paws-v1.0.0.apk
                        echo "### 🐾 9Paws Mobile App — v1.0.0" > v100_notes.md
                        echo "" >> v100_notes.md
                        echo "Phiên bản đầu tiên của ứng dụng 9Paws Financial Management." >> v100_notes.md
                        echo "- Xác thực tài khoản Google & Email." >> v100_notes.md
                        echo "- Quản lý hồ sơ cá nhân và bảo mật sinh trắc học (Fingerprint / Face ID)." >> v100_notes.md
                        echo "- Tùy chỉnh đa ngôn ngữ (Tiếng Việt / English)." >> v100_notes.md
                        gh release create "v1.0.0" ./9Paws-v1.0.0.apk \
                          --title "v1.0.0" \
                          --notes-file v100_notes.md \
                          --prerelease
                        echo "Đã tạo thành công release v1.0.0 kèm tệp APK."
                      fi
                    fi
                  fi

                  DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/${APK_NAME}"
                  echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV
                  echo "Direct APK download URL: $DOWNLOAD_URL"
            # ------------------------------------------------------------------------
            # LẤY TITLE & DESCRIPTION CỦA PR VỪA MERGE VÀO MAIN & CHUẨN BỊ EMAIL
            # ------------------------------------------------------------------------
            - name: Fetch PR Details & Prepare Email
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  DOWNLOAD_URL: ${{ env.DOWNLOAD_URL }}
                  REPOSITORY: ${{ github.repository }}
                  RUN_ID: ${{ github.run_id }}
                  RUN_NUMBER: ${{ github.run_number }}
              run: |
                  # Dùng GitHub CLI tra cứu PR tương ứng với commit vừa merge
                  PR_DATA=$(gh api -H "Accept: application/vnd.github+json" "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0] // empty' 2>/dev/null || echo "")

                  if [ -n "$PR_DATA" ]; then
                    export PR_TITLE=$(echo "$PR_DATA" | jq -r '.title // empty')
                    export PR_BODY=$(echo "$PR_DATA" | jq -r '.body // empty')
                  fi

                  if [ -z "$PR_TITLE" ]; then
                    export PR_TITLE="${{ github.event.head_commit.message }}"
                  fi
                  if [ -z "$PR_BODY" ]; then
                    export PR_BODY="Cập nhật trực tiếp từ nhánh main."
                  fi

                  echo "PR Title: $PR_TITLE"

                  # Cài đặt markdown và render HTML chuyên nghiệp cho email
                  python3 -m pip install markdown
                  python3 .github/scripts/prepare-staging-email.py

            # ------------------------------------------------------------------------
            # GỬI EMAIL THÔNG BÁO CHO TESTERS (KÈM LINK TẢI TRỰC TIẾP & QR CODE TỰ ĐỘNG TẢI)
            # ------------------------------------------------------------------------
            - name: Send Email with Download Link to Testers
              uses: dawidd6/action-send-mail@v3
              with:
                  server_address: smtp.gmail.com
                  server_port: 465
                  secure: true
                  username: ${{ secrets.MAIL_USERNAME }}
                  password: ${{ secrets.MAIL_PASSWORD }}
                  subject: "🐾 [9Paws Staging] Phiên bản thử nghiệm #${{ github.run_number }} sẵn sàng"
                  to: ${{ secrets.TESTER_EMAILS }}
                  from: "9Paws Team <${{ secrets.MAIL_USERNAME }}>"
                  html_body: file://email-ready.html
