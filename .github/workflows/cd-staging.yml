name: CD Staging - Build Lightweight APK & Notify Testers (main)

on:
    push:
        branches: [main]

jobs:
    staging-pipeline:
        name: Build Fast Staging APK & Notify Testers
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: read
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Kéo toàn bộ lịch sử commit để đọc thông tin PR

            - name: Inject Environment Variables from Secrets
              run: |
                  touch .env
                  if [ -n "${{ secrets.EXPO_PUBLIC_API_BASE_URL }}" ]; then
                    echo "EXPO_PUBLIC_API_BASE_URL=${{ secrets.EXPO_PUBLIC_API_BASE_URL }}" >> .env
                    echo "EXPO_PUBLIC_API_BASE_URL=${{ secrets.EXPO_PUBLIC_API_BASE_URL }}" >> $GITHUB_ENV
                  fi
                  if [ -n "${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}" ]; then
                    echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}" >> .env
                    echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}" >> $GITHUB_ENV
                  fi
                  echo "Successfully injected environment variables from repository secrets into .env"

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Verify Code Quality (Lint & Typecheck)
              run: |
                  npm run lint
                  npx tsc --noEmit

            - name: Set up Java JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "17"

            - name: Generate Android Native Project (Fast Prebuild)
              env:
                  EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
                  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
              run: npx expo prebuild --platform android --clean --no-install

            - name: Setup Gradle Build Cache
              uses: gradle/actions/setup-gradle@v4

            - name: Restore Keystore from Secrets
              run: |
                  echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

            - name: Configure Gradle Signing & Extreme Speed Tuning
              env:
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
              run: python3 .github/scripts/configure-staging-gradle.py

            - name: Build APK via Parallel Gradle
              env:
                  EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
                  EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
              run: |
                  cd android
                  chmod +x gradlew
                  ./gradlew assembleRelease --build-cache --parallel -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

            - name: Check APK Size
              run: |
                  APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
                  cp $APK_FILE ./9Paws-Staging.apk
                  ls -lh 9Paws-Staging.apk

            - name: Upload APK Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: 9Paws-Staging-APK
                  path: ./9Paws-Staging.apk
                  retention-days: 14

            # ------------------------------------------------------------------------
            # PHÁT HÀNH BẢN STAGING PRE-RELEASE TRÊN GITHUB & TẠO LINK TẢI TRỰC TIẾP
            # ------------------------------------------------------------------------
            - name: Publish Staging Pre-Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG_NAME="staging-build-${{ github.run_number }}"
                  gh release create "$TAG_NAME" ./9Paws-Staging.apk \
                    --title "🐾 9Paws Staging Build #${{ github.run_number }}" \
                    --notes "Bản thử nghiệm Staging tự động biên dịch từ nhánh main (commit: ${{ github.sha }})." \
                    --prerelease || gh release upload "$TAG_NAME" ./9Paws-Staging.apk --clobber

                  DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/9Paws-Staging.apk"
                  echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV
                  echo "Staging APK direct download URL: $DOWNLOAD_URL"

            # ------------------------------------------------------------------------
            # LẤY TITLE & DESCRIPTION CỦA PR VỪA MERGE VÀO MAIN
            # ------------------------------------------------------------------------
            - name: Fetch PR Details & Prepare Email
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  DOWNLOAD_URL: ${{ env.DOWNLOAD_URL }}
                  REPOSITORY: ${{ github.repository }}
                  RUN_ID: ${{ github.run_id }}
                  RUN_NUMBER: ${{ github.run_number }}
              run: |
                  # Dùng GitHub CLI tra cứu PR tương ứng với commit vừa merge
                  PR_DATA=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0] // empty')

                  if [ -n "$PR_DATA" ]; then
                    export PR_TITLE=$(echo "$PR_DATA" | jq -r '.title')
                    export PR_BODY=$(echo "$PR_DATA" | jq -r '.body // "Không có mô tả chi tiết."')
                  else
                    export PR_TITLE="${{ github.event.head_commit.message }}"
                    export PR_BODY="Cập nhật trực tiếp từ nhánh main."
                  fi

                  echo "PR Title: $PR_TITLE"

                  # Cài đặt markdown và render HTML chuyên nghiệp cho email
                  python3 -m pip install markdown
                  python3 .github/scripts/prepare-staging-email.py

            # ------------------------------------------------------------------------
            # GỬI EMAIL THÔNG BÁO CHO TESTERS (KÈM LINK TẢI TRỰC TIẾP & QR CODE)
            # ------------------------------------------------------------------------
            - name: Send Email with Download Link to Testers
              uses: dawidd6/action-send-mail@v3
              with:
                  server_address: smtp.gmail.com
                  server_port: 465
                  secure: true
                  username: ${{ secrets.MAIL_USERNAME }}
                  password: ${{ secrets.MAIL_PASSWORD }}
                  subject: "🐾 [9Paws Staging] Phiên bản thử nghiệm #${{ github.run_number }} sẵn sàng"
                  to: ${{ secrets.TESTER_EMAILS }}
                  from: "9Paws Team <${{ secrets.MAIL_USERNAME }}>"
                  html_body: file://email-ready.html
