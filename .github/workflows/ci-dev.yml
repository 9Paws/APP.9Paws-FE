name: CI Quality Gate (Development)
on:
    pull_request:
        branches: [dev]
    push:
        branches: [dev]
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    quality-gate:
        name: Code Quality & Expo Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Check Linting
              run: npm run lint

            - name: Check Typescript
              run: npx tsc --noEmit

            - name: Check Expo Doctor
              run: npx expo-doctor
